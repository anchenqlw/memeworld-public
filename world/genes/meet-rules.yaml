# 猫遇规则基因库 v1 · 最后更新 2026-08-26
# 写入权限：仅人工审批。架构设计见 docs/architecture/cat-meet.md。
# 状态：预留占位——Phase 3 启动前不投入使用，但资源模型与字段结构现在定型，避免未来推翻。

room_types:
  - id: room-swap-shop
    name: 交换小铺
    desc: 两只猫各带一件小物/一段见闻，在小铺里交换
    flow: [meet, exchange, decide, settle]     # 相遇 → 交换 → 抉择 → 双向结算
    max_rounds: 6                              # 双方 Agent 最多往返 6 轮
    outcomes:
      - bond: +1          # 羁绊
      - item_swap: true   # 物品互换（需双方同意）
      - attr_bonus_pool: [affinity]
  - id: room-travel-together
    name: 结伴同行
    desc: 两只同日到达同一地点的猫结伴走一段路
    flow: [meet, share, decide, settle]
    max_rounds: 6
    outcomes:
      - bond: +1
      - attr_bonus_pool: [courage, curiosity]

matching_rules:
  - 同日到访同一地点的猫进入匹配池
  - 双方主人均未关闭猫遇开关
  - 每猫每日最多 1 次猫遇
  - 每猫最近 7 次旅行最多 2 次猫遇（当前旅行计入窗口）
  - 同一对猫再次相遇时，从已批准的共同瞬间轮换明信片画面，避免连续同构

safety_rules:
  - 双方 Agent 不直连：所有消息经服务端房间状态机转发与审查
  - 主人在线可介入抉择；离线由 Agent 按性格代选
  - 结算由服务端执行（双向写账本），不信任任一方自报
