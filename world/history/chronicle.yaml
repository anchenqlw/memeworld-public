  - id: chronicle-2026-07-12-event-pool
    date: "2026-07-12"
    title: 每日见闻开始轮换
    summary: 三个种子地点迎来五种新事件，小猫每天出门都可能遇见不同的天象、集会、发现与考验。
    change_type: 新事件
    source_kind: owner
    proposal_id: null
    contributor_cat_name: null
    history_file: world/history/2026-07-12-evolution.md
